  <!-- Manipulação Fala -> Texto -->
  <script>

    var xhr = null;

    getXmlHttpRequestObject = function () {
        if (!xhr) {
            // Create a new XMLHttpRequest object 
            xhr = new XMLHttpRequest();
        }
        return xhr;
    };

    function sendDataCallback() {
        // Check response is ready or not
        if (xhr.readyState == 4 && xhr.status == 201) {
            console.log(xhr.responseText);
            // getDate();
            // dataDiv = document.getElementById('sent-data-container');
            // Set current data text
            editor.updateCode(xhr.responseText + '\n');
        }
    }
	
	function sendData(str) {
        dataToSend = str;
        if (!dataToSend) {
            console.log("Data is empty.");
            return;
        }
        console.log("Sending data: " + dataToSend);
        xhr = getXmlHttpRequestObject();
        xhr.onreadystatechange = sendDataCallback;
        // asynchronous requests
        xhr.open("POST", "http://localhost:6969/", true);
        xhr.setRequestHeader("Content-Type", "text/plain;charset=UTF-8");
        // Send the request over the network
        xhr.send(dataToSend);
    }
	

    let mediaRecorder;
    let audioChunks = [];

    const startButton = document.getElementById('startButton');
    const divOutput = document.getElementById('outputText');
    const recognition = new webkitSpeechRecognition() || new SpeechRecognition();

    recognition.interimResults = true;
    recognition.continuous = false;
    recognition.lang = "pt-BR";

    startButton.addEventListener('click', () => {
        recognition.start();
        divOutput.textContent = '';
        startButton.disabled = true;
        startButton.textContent = 'Ouvindo...';
    });

    startButton.onclick = async () => {
        audioChunks = []; // Reset audio chunks
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
    
        mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
        };
    
        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            sendAudioToServer(audioBlob);
        };
    
        mediaRecorder.start();
        //startButton.disabled = true;
        //stopButton.disabled = false;
    };

    recognition.onresult = event => {
        const result = event.results[event.results.length - 1][0].transcript;
        divOutput.textContent = result;
    };

    recognition.onend = () => {
        //console.log(divOutput.textContent);
        transcription();
        //sendData();
        startButton.disabled = false;
        startButton.textContent = 'Iniciar Captura de Fala';

        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
    };

    recognition.onerror = event => {
        console.error('Erro no reconhecimento de voz:', event.error);
    };

    recognition.onnomatch = () => {
        console.log('Nenhuma fala detectada');
    };

    function formatText(text) {
        const segments = text.split(/(?<=[.!?])\s+/);
        let formattedText = '';
        let currentLine = '';
    
        segments.forEach(segment => {
            if (currentLine.length + segment.length > 100) {  // Adjust 100 to your preferred line length
                formattedText += currentLine.trim() + '\n';
                currentLine = '';
            }
            currentLine += segment + ' ';
                
            if (/[.!?]$/.test(segment)) {
                formattedText += currentLine.trim() + '\n';
                currentLine = '';
            }
        });
    
        if (currentLine) {
            formattedText += currentLine.trim();
        }
    
        return formattedText.trim();
    }

    function sendAudioToServer(audioBlob) {
        const formData = new FormData();
        formData.append('audio', audioBlob, 'recording.wav');
    
        fetch('transcribe.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.text())
        .then(text => {
            const formattedText = formatText(text);
            sendData(formattedText);
            console.log('ChatGPT: ' + formattedText);
            //divOutput.textContent = formattedText;
            //copyButton.disabled = false;
            //clearButton.disabled = false;
            //status.textContent = 'Transcription complete!';
        })
        .catch(error => {
            console.error('Error:', error);
            //output.textContent = 'Error occurred during transcription.';
            //status.textContent = 'An error occurred.';
            //clearButton.disabled = false;
        });
    }

</script>
